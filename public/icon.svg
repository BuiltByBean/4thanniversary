<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="H and M inside a heart">
  <rect width="512" height="512" fill="#FCF7EF"/>

  <!-- the letterpress double rule -->
  <rect x="26" y="26" width="460" height="460" rx="10" fill="none" stroke="#D9CBB8" stroke-width="4"/>
  <rect x="42" y="42" width="428" height="428" rx="6" fill="none" stroke="#D9CBB8" stroke-width="3"/>

  <!-- heart -->
  <path d="M256 430 C256 430 78 318 78 208 C78 140 128 96 186 96 C220 96 246 114 256 140 C266 114 292 96 326 96 C384 96 434 140 434 208 C434 318 256 430 256 430 Z"
        fill="#A8453B"/>

  <!-- H + M, cream on rose -->
  <g fill="#FCF7EF" font-family="Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">
    <text x="186" y="248" font-size="132">H</text>
    <text x="256" y="238" font-size="70">+</text>
    <text x="330" y="248" font-size="132">M</text>
  </g>
</svg>
